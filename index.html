
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageText AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 12px 40px #17203312;
    }
    h1 { margin-bottom: 8px; }
    .muted { color: #657089; line-height: 1.6; }
    .upload {
      margin: 24px 0;
      padding: 28px;
      border: 2px dashed #b9c6df;
      border-radius: 14px;
      text-align: center;
    }
    input { max-width: 100%; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      background: #2458db;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #preview { display: none; max-width: 100%; max-height: 300px;
      margin: 20px auto; border-radius: 10px; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere;
      background: #f4f6fb; padding: 16px; border-radius: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>ImageText AI</h1>
    <p class="muted">Turn text inside images into editable words.</p>

    <div class="upload">
      <strong>Choose an image to get started</strong><br>
      <input id="file" type="file" accept="image/*">
      <img id="preview" alt="Selected image preview">
    </div>

    <button id="extract" disabled>Extract text</button>
    <h3>Extracted text</h3>
    <p id="result" class="muted">Your extracted text will appear here.</p>
    <button id="copy" disabled>Copy text</button>
  </main>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const extract = document.getElementById("extract");
    const result = document.getElementById("result");
    const copy = document.getElementById("copy");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      extract.disabled = false;
      result.textContent = "Image ready. OCR connection is our next step.";
    });

    extract.addEventListener("click", () => {
      result.textContent = "The website is ready; we'll connect the OCR backend next.";
    });

    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(result.textContent);
      copy.textContent = "Copied!";
    });
  </script>
</body>
</html>
